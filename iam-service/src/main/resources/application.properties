spring.application.name=iam-service

# --- CONFIGURATION DATABASE (IAM LOGIC) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/iam_logic_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password_secure}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- CONFIGURATION RABBITMQ ---
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# --- CONFIGURATION SECURITY (OAUTH2 RESOURCE SERVER) ---
# Ceci sert à valider les JWT envoyés par le frontend/mobile
# L'issuer DOIT être localhost (pour correspondre au token du navigateur)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/ExamsRealm

# Mais l'URI des clés DOIT utiliser le nom du conteneur pour que Java puisse y accéder !
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://iam-keycloak:8080/realms/ExamsRealm/protocol/openid-connect/certs

# --- CONFIGURATION KEYCLOAK ADMIN CLIENT (CUSTOM PROPERTIES) ---
# Ces propriétés seront lues par ton Bean KeycloakConfig
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
keycloak.realm=ExamsRealm
keycloak.client-id=iam-admin-client
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:k2jrL3KQ0lNNY3VF8sZxLQ3azw0FUi36} 

# --- CONFIGURATION SERVEUR ---
server.port=8081

# --- CONFIGURATION CONSUL (SERVICE DISCOVERY) ---
# Le nom sous lequel la Gateway va chercher ce service
spring.cloud.consul.discovery.service-name=${spring.application.name}

# Adresse du serveur Consul lancé via Docker
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=8500

# Configuration de l'instance
# On utilise un ID unique pour éviter les conflits si tu lances plusieurs instances
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}

# Consul vérifie si le service est vivant via cet endpoint (Actuator)
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s

# On demande à Consul de contacter le service via son nom DNS Docker
spring.cloud.consul.discovery.prefer-ip-address=false
spring.cloud.consul.discovery.hostname=iam-service-app

# --- ACTIVATION DES ENDPOINTS DE SANTÉ ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Force Consul à utiliser le port interne du conteneur pour le check
spring.cloud.consul.discovery.port=8081